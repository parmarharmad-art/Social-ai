name: Kiran Talking Reels tests
on:
  push:
    paths:
      - "kiran-talking-reels/**"
  pull_request:
    paths:
      - "kiran-talking-reels/**"
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: kiran-talking-reels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: pytest -q
        env:
          PYTHONPATH: .
