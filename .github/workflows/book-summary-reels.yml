name: book-summary-reels
on:
  workflow_dispatch:
    inputs:
      confirm_review_only:
        description: "Confirm this run prepares content only; it does not publish to Instagram"
        required: true
        type: boolean
        default: true
  push:
    paths:
      - "social-content/book_summaries.json"
      - "social-content/validate_book_summaries.py"
      - "social-content/render_book_reels.py"
      - "social-content/voice.py"
      - "social-content/prepare_book_covers.py"
      - "social-content/gen_reels.py"
      - ".github/workflows/book-summary-reels.yml"
permissions:
  contents: read
concurrency:
  group: book-summary-reels-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.confirm_review_only == true
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate 30-day book-summary plan
        working-directory: social-content
        run: python validate_book_summaries.py
      - name: Install video rendering dependencies and Hindi TTS
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow numpy gTTS edge-tts
      - name: Fetch the matching book cover for every Reel
        working-directory: social-content
        run: |
          set -euo pipefail
          mkdir -p book_reels/covers
          python prepare_book_covers.py book_summaries.json book_reels/covers
      - name: Render 30 book-summary Reels with book covers and Hindi voiceover
        working-directory: social-content
        env:
          REQUIRE_VOICE: "1"
          REEL_TTS_LANGUAGE: "hi"
          SKIP_EXISTING: "0"
        run: |
          set -euo pipefail
          OUT="book_reels/${GITHUB_RUN_ID}"
          ASSETS="$(mktemp -d)"
          cp -a assets/. "$ASSETS/"
          cp book_reels/covers/book_*.png "$ASSETS/"
          python render_book_reels.py book_summaries.json "$ASSETS" "$OUT"
      - name: Validate all 30 MP4 videos and audio streams
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          out = Path("social-content/book_reels") / os.environ["RUN_ID"]
          files = sorted(out.glob("*.mp4"))
          if len(files) != 30:
              raise SystemExit(f"Expected 30 MP4 files, found {len(files)} in {out}")
          report = []
          for index, path in enumerate(files, 1):
              probe = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "stream=codec_type,width,height", "-show_entries", "format=duration", "-of", "json", str(path)],
                  capture_output=True, text=True
              )
              if probe.returncode:
                  raise SystemExit(f"ffprobe failed for {path.name}: {probe.stderr}")
              data = json.loads(probe.stdout)
              streams = data.get("streams", [])
              video = next((s for s in streams if s.get("codec_type") == "video"), None)
              audio = next((s for s in streams if s.get("codec_type") == "audio"), None)
              duration = float(data.get("format", {}).get("duration", 0))
              if not video or (video.get("width"), video.get("height")) != (1080, 1920):
                  raise SystemExit(f"{path.name}: invalid video stream/dimensions: {video}")
              if not audio:
                  raise SystemExit(f"{path.name}: missing audio stream")
              if not 12 <= duration <= 120:
                  raise SystemExit(f"{path.name}: duration outside 12-120 seconds: {duration}")
              report.append({"file": path.name, "duration_seconds": round(duration, 2), "video": "1080x1920", "audio": True})
          Path("social-content/book-summary-quality-report.json").write_text(json.dumps(report, indent=2), encoding="utf-8")
          print(f"PASS: validated {len(report)} MP4 reels; all are 1080x1920 with audio and 12-120 second duration.")
          PY
      - name: Upload uniquely named book Reels review package
        uses: actions/upload-artifact@v4
        with:
          name: book-summary-reels-${{ github.run_id }}
          path: |
            social-content/book_reels/${{ github.run_id }}/*.mp4
            social-content/book_summaries.json
            social-content/book-summary-quality-report.json
          if-no-files-found: error
          retention-days: 30
      - name: Confirm review-only delivery
        run: echo "Neural Hindi book-summary Reels generated for review. Instagram publishing is disabled."
