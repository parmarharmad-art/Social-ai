name: Free MuseTalk lip-sync smoke test
on:
  push:
    paths:
      - ".github/workflows/musetalk-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install free test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install "gradio_client>=1.7,<2" gTTS
      - name: Run one real talking-photo inference through public free MuseTalk Space
        run: |
          python - <<'PY'
          import json, shutil, subprocess
          from pathlib import Path
          from gtts import gTTS
          from gradio_client import Client

          photo = Path("social-content/assets/person_b.png")
          audio = Path("/tmp/musetalk-smoke.mp3")
          output = Path("talking-smoke.mp4")
          if not photo.exists():
              raise SystemExit("Smoke-test portrait not found in repository.")
          gTTS("नमस्ते दोस्तों, मैं किरण कुमार। AI automation की आसान tips के लिए follow करें।", lang="hi").save(str(audio))
          print("Connecting to public MuseTalk ZeroGPU Space...")
          client = Client("henrybit/musetalk-1-5", verbose=False)
          result = client.predict(str(audio), str(photo), 0, 10, "jaw", 90, 90, api_name="/generate")
          candidate = result[0] if isinstance(result, (tuple, list)) else result
          if isinstance(candidate, dict):
              candidate = candidate.get("path") or candidate.get("url") or candidate.get("video")
          if isinstance(candidate, dict):
              candidate = candidate.get("path") or candidate.get("url")
          if not candidate:
              raise SystemExit("MuseTalk returned no video: " + repr(result))
          candidate = str(candidate)
          if candidate.startswith(("https://", "http://")):
              import urllib.request
              urllib.request.urlretrieve(candidate, output)
          else:
              src = Path(candidate)
              if not src.exists():
                  raise SystemExit("MuseTalk output path does not exist: " + candidate)
              shutil.copy2(src, output)
          if output.stat().st_size < 100_000:
              raise SystemExit("MuseTalk output is unexpectedly small.")
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-show_entries", "stream=codec_type,width,height", "-of", "json", str(output)],
              check=True, capture_output=True, text=True
          )
          info = json.loads(probe.stdout)
          streams = info.get("streams", [])
          if not any(s.get("codec_type") == "video" for s in streams):
              raise SystemExit("Smoke output has no video stream.")
          if not any(s.get("codec_type") == "audio" for s in streams):
              raise SystemExit("Smoke output has no audio stream.")
          print("MUSEtalk_SMOKE_SUCCESS", json.dumps({
              "file": str(output), "bytes": output.stat().st_size,
              "duration": info.get("format", {}).get("duration"),
              "streams": streams
          }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: free-musetalk-smoke-video
          path: talking-smoke.mp4
          if-no-files-found: error
