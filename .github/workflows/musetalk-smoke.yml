name: Free MuseTalk lip-sync smoke test
on:
  push:
    paths:
      - ".github/workflows/musetalk-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Reel Studio and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r kiran-talking-reels/requirements.txt
      - name: Run two-chunk real lip-sync and validate final vertical MP4
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          from gtts import gTTS

          sys.path.insert(0, "kiran-talking-reels")
          from app import run_free_musetalk
          from src.video_renderer import render

          photo = Path("social-content/assets/person_rgba.png")
          raw_audio = Path("/tmp/musetalk-full.mp3")
          audio = Path("/tmp/musetalk-smoke.wav")
          work = Path("/tmp/musetalk-work")
          work.mkdir(parents=True, exist_ok=True)
          output = Path("talking-smoke.mp4")
          if not photo.exists():
              raise SystemExit("Smoke-test portrait not found.")
          gTTS("नमस्ते, मैं किरण कुमार हूँ। AI automation से काम आसान होता है। ऐसी tips के लिए follow करें।", lang="hi").save(str(raw_audio))
          subprocess.run(["ffmpeg", "-y", "-i", str(raw_audio), "-t", "5.6", "-ac", "1", "-ar", "16000", str(audio)], check=True, capture_output=True, text=True)
          duration_probe = subprocess.run(["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "default=noprint_wrappers=1:nokey=1", str(audio)], check=True, capture_output=True, text=True)
          duration = float(duration_probe.stdout.strip())
          if duration < 4.0 or duration > 6.0:
              raise SystemExit(f"Smoke audio duration outside expected 4–6 seconds: {duration}")
          print(f"Running the real app pipeline on a {duration:.2f}s voiceover; expected two MuseTalk chunks.")
          talking_video = run_free_musetalk(audio, photo, work)
          render(photo, audio, output, round(duration), talking_video_path=talking_video)
          probe = subprocess.run(
              ["ffprobe", "-v", "error", "-show_entries", "format=duration",
               "-show_entries", "stream=codec_type,width,height", "-of", "json", str(output)],
              check=True, capture_output=True, text=True
          )
          info = json.loads(probe.stdout)
          streams = info.get("streams", [])
          video = next((s for s in streams if s.get("codec_type") == "video"), None)
          audio_stream = next((s for s in streams if s.get("codec_type") == "audio"), None)
          if not video or video.get("width") != 720 or video.get("height") != 1280:
              raise SystemExit("Final MP4 is not 720x1280 vertical video.")
          if not audio_stream:
              raise SystemExit("Final MP4 has no audio track.")
          if output.stat().st_size < 100_000:
              raise SystemExit("Final MP4 is unexpectedly small.")
          print("MUSEtalk_PIPELINE_SUCCESS", json.dumps({
              "file": str(output), "bytes": output.stat().st_size,
              "duration": info.get("format", {}).get("duration"), "video": video, "audio": audio_stream
          }))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: free-musetalk-smoke-video
          path: talking-smoke.mp4
          if-no-files-found: error
