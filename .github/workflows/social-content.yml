name: social-content
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/sai.zip"
      - "social-content-working-package.zip"
      - ".github/workflows/social-content.yml"
      - ".github/scripts/**"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Restore social-content folder from uploaded ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP=""
          if [ -f ".github/workflows/sai.zip" ]; then ZIP=".github/workflows/sai.zip"; fi
          if [ -f "social-content-working-package.zip" ]; then ZIP="social-content-working-package.zip"; fi
          if [ -z "$ZIP" ]; then
            echo "::error::No uploaded ZIP found. Expected .github/workflows/sai.zip or social-content-working-package.zip"
            find . -maxdepth 3 -type f | head -100
            exit 1
          fi
          echo "Using uploaded package: $ZIP"
          mkdir -p /tmp/social-package
          unzip -o "$ZIP" -d /tmp/social-package
          SOURCE="$(find /tmp/social-package -type f -name render_ig.py -print -quit)"
          if [ -z "$SOURCE" ]; then
            echo "::error::ZIP does not contain render_ig.py"
            find /tmp/social-package -maxdepth 4 -type f | head -100
            exit 1
          fi
          SOURCE_DIR="$(dirname "$SOURCE")"
          mkdir -p social-content
          cp -a "$SOURCE_DIR/." social-content/
          test -f social-content/gen_reels.py
          test -f social-content/ig.json
          test -f social-content/reels.json
          test -f social-content/assets/person_rgba.png
          echo "Source package restored."
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg espeak-ng
          pip install pillow numpy edge-tts gTTS
      - name: Instagram cards
        working-directory: social-content
        run: python render_ig.py ig.json assets/person_rgba.png ig_cards
      - name: Reels with voiceover
        working-directory: social-content
        env:
          SKIP_EXISTING: "1"
        run: python gen_reels.py reels.json assets reels
      - name: Validate generated outputs
        run: |
          test -n "$(find social-content/ig_cards -maxdepth 1 -type f -name '*.jpg' -print -quit)"
          test -n "$(find social-content/reels -maxdepth 1 -type f -name '*.mp4' -print -quit)"
      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add social-content
          git commit -m "Generate Instagram cards and reels" || echo "nothing to commit"
          git pull --rebase
          git push
      - name: Publish Reel to Instagram (optional; requires Meta credentials and a public video URL)
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_REEL_VIDEO_URL: ${{ vars.INSTAGRAM_REEL_VIDEO_URL }}
          INSTAGRAM_CAPTION: ${{ vars.INSTAGRAM_CAPTION }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: |
          if [ -z "$INSTAGRAM_USER_ID" ] || [ -z "$INSTAGRAM_ACCESS_TOKEN" ] || [ -z "$INSTAGRAM_REEL_VIDEO_URL" ]; then
            echo "Instagram auto-publish skipped: configure INSTAGRAM_USER_ID, INSTAGRAM_ACCESS_TOKEN secrets and INSTAGRAM_REEL_VIDEO_URL variable."
            exit 0
          fi
          python .github/scripts/instagram_publish.py
