name: social-content
on:
  workflow_dispatch:
    inputs:
      publish_reel:
        description: "Publish one generated Reel to Instagram after validation"
        required: false
        type: boolean
        default: true
      reel_number:
        description: "Reel number to publish (latest or 01-60)"
        required: false
        type: string
        default: "latest"
      caption:
        description: "Optional caption override; leave blank to use reels.json"
        required: false
        type: string
        default: ""
  push:
    paths:
      - ".github/workflows/sai.zip"
      - "social-content-working-package.zip"
      - ".github/scripts/**"
      - ".github/workflows/social-content.yml"
      - ".github/skills/**"
      - "social-content/**"
      - "!social-content/ig_cards/**"
      - "!social-content/reels/**"
concurrency:
  group: social-content-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate social automation skills and inputs
        run: python .github/scripts/validate_social_skills.py
      - name: Audit content against seven-skill standards
        run: python social-content/audit_content_quality.py
      - name: Install
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg espeak-ng
          pip install pillow numpy edge-tts gTTS
      - name: Instagram cards
        working-directory: social-content
        run: python render_ig.py ig.json assets/person_rgba.png ig_cards
      - name: Reels with voiceover (varied templates)
        working-directory: social-content
        env:
          REQUIRE_VOICE: "1"
          SKIP_EXISTING: "0"
        run: python gen_reels.py reels.json assets reels
      - name: Validate every generated output
        shell: bash
        run: |
          set -euo pipefail
          CARD_COUNT="$(find social-content/ig_cards -maxdepth 1 -type f -name '*.jpg' | wc -l)"
          REEL_COUNT="$(find social-content/reels -maxdepth 1 -type f -name '*.mp4' | wc -l)"
          test "$CARD_COUNT" -ge 30
          test "$REEL_COUNT" -ge 60
          for f in social-content/reels/*.mp4; do
            test -s "$f"
            DIM="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$f" | head -1)"
            AUDIO="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$f" | head -1)"
            test "$DIM" = "1080x1920"
            test "$AUDIO" = "audio"
          done
          echo "Validated $CARD_COUNT cards and $REEL_COUNT vertical MP4 Reels with audio."
      - name: Upload generated cards and Reels
        uses: actions/upload-artifact@v4
        with:
          name: social-content-output
          path: |
            social-content/ig_cards/*.jpg
            social-content/reels/*.mp4
          if-no-files-found: error
          retention-days: 7
      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add social-content
          git commit -m "Generate Instagram cards and reels" || echo "nothing to commit"
          git pull --rebase
          git push
      - name: Publish selected Reel to Instagram
        if: github.event_name == 'workflow_dispatch' && inputs.publish_reel == true
        env:
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_REEL_VIDEO_URL: ${{ vars.INSTAGRAM_REEL_VIDEO_URL }}
          INSTAGRAM_REEL_NUMBER: ${{ inputs.reel_number }}
          INSTAGRAM_CAPTION: ${{ inputs.caption }}
          META_GRAPH_API_VERSION: ${{ vars.META_GRAPH_API_VERSION }}
        run: python .github/scripts/instagram_publish.py
