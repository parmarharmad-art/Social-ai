name: social-content
on:
  workflow_dispatch:
  push:
    paths:
      - "social-content-working-package.zip"
      - "social-content/**"
      - ".github/workflows/social-content.yml"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Restore social-content folder from uploaded ZIP
        run: |
          if [ -f social-content-working-package.zip ]; then
            unzip -o social-content-working-package.zip -d .
          fi
          test -f social-content/render_ig.py
          test -f social-content/gen_reels.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          sudo apt-get update -y && sudo apt-get install -y ffmpeg espeak-ng
          pip install pillow numpy edge-tts gTTS
      - name: Instagram cards
        working-directory: social-content
        run: python render_ig.py ig.json assets/person_rgba.png ig_cards
      - name: Reels with voiceover
        working-directory: social-content
        env:
          SKIP_EXISTING: "1"
        run: python gen_reels.py reels.json assets reels
      - name: Validate generated outputs
        run: |
          test -d social-content/ig_cards
          test -n "$(find social-content/ig_cards -maxdepth 1 -type f -name '*.jpg' -print -quit)"
          test -d social-content/reels
          test -n "$(find social-content/reels -maxdepth 1 -type f -name '*.mp4' -print -quit)"
      - name: Commit outputs
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add social-content/ig_cards social-content/reels
          git commit -m "Update generated cards and reels" || echo "nothing to commit"
          git pull --rebase
          git push
