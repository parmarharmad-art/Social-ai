name: AI Social Content Creator
on:
  workflow_dispatch:
    inputs:
      brief:
        description: "Niche, topic, audience, offer, and goal"
        required: true
        type: string
      platform:
        description: "Target platform"
        required: true
        type: choice
        options:
          - Instagram
          - LinkedIn
          - Facebook
          - YouTube Shorts
          - TikTok
      count:
        description: "Number of draft items (1-15)"
        required: true
        default: "5"
        type: string
      language:
        description: "Content language, e.g. Hindi or English"
        required: true
        default: "English"
        type: string
permissions:
  contents: read
concurrency:
  group: ai-content-creator
  cancel-in-progress: false
jobs:
  create-content:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Check required API secret
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::OPENAI_API_KEY is missing. Add it under Repository Settings > Secrets and variables > Actions. API usage may incur charges."
            exit 1
          fi
      - name: Generate content using the seven skill standards
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          BRIEF: ${{ inputs.brief }}
          PLATFORM: ${{ inputs.platform }}
          COUNT: ${{ inputs.count }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          python social-content/create_content_pack.py \
            --brief "$BRIEF" \
            --platform "$PLATFORM" \
            --count "$COUNT" \
            --language "$LANGUAGE" \
            --out social-content/generated
      - name: Install free Reel rendering dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install --upgrade pip
          pip install pillow numpy edge-tts gTTS
      - name: Convert generated drafts into Reel-renderer input
        run: |
          python social-content/pack_to_reels.py \
            --input social-content/generated/content-pack.json \
            --output social-content/generated/reels.json
      - name: Render vertical Reel previews with voiceover
        env:
          REQUIRE_VOICE: "1"
          REEL_VOICE: ${{ inputs.language == 'Hindi' && 'hi-IN-SwaraNeural' || 'en-IN-NeerjaNeural' }}
          REEL_TTS_LANGUAGE: ${{ inputs.language == 'Hindi' && 'hi' || 'en' }}
          SKIP_EXISTING: "0"
        run: |
          python social-content/gen_reels.py \
            social-content/generated/reels.json \
            social-content/assets \
            social-content/generated/reels
      - name: Validate generated video previews
        run: |
          set -euo pipefail
          count="$(find social-content/generated/reels -maxdepth 1 -type f -name '*.mp4' | wc -l)"
          test "$count" -eq "${{ inputs.count }}"
          for f in social-content/generated/reels/*.mp4; do
            test -s "$f"
            dim="$(ffprobe -v error -select_streams v:0 -show_entries stream=width,height -of csv=s=x:p=0 "$f" | head -1)"
            audio="$(ffprobe -v error -select_streams a:0 -show_entries stream=codec_type -of csv=p=0 "$f" | head -1)"
            test "$dim" = "1080x1920"
            test "$audio" = "audio"
          done
          echo "Validated $count vertical MP4 previews with audio."
      - name: Upload content pack and Reel previews
        uses: actions/upload-artifact@v4
        with:
          name: ai-social-content-output
          path: |
            social-content/generated/content-pack.md
            social-content/generated/content-pack.json
            social-content/generated/reels/*.mp4
          if-no-files-found: error
          retention-days: 7
