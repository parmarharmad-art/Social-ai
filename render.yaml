services:
  - type: web
    name: socialpilot-ai-mvp
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: AUTOMATION_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-4o-mini
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: APP_BASE_URL
        value: https://socialpilot-ai-mvp.onrender.com
      - key: META_WEBHOOK_VERIFY_TOKEN
        sync: false
      - key: AUTO_REPLY_ENABLED
        value: "false"
      - key: AUTO_CONTENT_ENABLED
        value: "false"
      - key: INSTAGRAM_USER_ID
        sync: false
      - key: SESSION_SECRET
        generateValue: true
